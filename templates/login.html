{% extends "base.html" %}

{% block title %}{{ t('login_title') }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">

        <!-- Login Card -->
        <div class="card card-wari mt-4">
            <div class="card-header text-center">
                <h4 class="mb-0"><i class="bi bi-box-arrow-in-right"></i> {{ t('login_title') }}</h4>
            </div>
            <div class="card-body p-4">
                <p class="text-muted text-center mb-4">
                    {{ t('login_subtitle') }}
                </p>

                <form method="POST" action="/login" id="loginForm" novalidate>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">
                            <i class="bi bi-telephone"></i> {{ t('phone') }}
                        </label>
                        <input type="tel" class="form-control" id="phone" name="phone"
                               placeholder="{{ t('phone') }}"
                               value="{{ phone if phone else '' }}" required autofocus>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock"></i> {{ t('passcode_label') }}
                        </label>
                        <input type="password" class="form-control" id="password" name="password"
                               placeholder="{{ t('passcode_label') }}" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-wari btn-lg" id="loginBtn">
                            <i class="bi bi-box-arrow-in-right"></i> {{ t('login_title') }}
                        </button>
                    </div>
                </form>

                <!-- Link to Register -->
                <div class="text-center mt-3">
                    <p class="mb-0">{{ t('dont_have_account') }}</p>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    /**
     * Client-side form validation for login.
     */
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;

        if (!phone || !password) {
            e.preventDefault();
            showToast('Please enter both phone number and password.', 'warning');
            return;
        }
    });
</script>
{% endblock %}
