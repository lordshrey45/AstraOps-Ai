{% extends "base.html" %}

{% block title %}{{ t('login_admin_title') }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-6 col-lg-5">

        <!-- Admin Login Card -->
        <div class="card mt-3 shadow border-0 rounded-4" style="background: #ffffff; border-top: 4px solid #1a202c !important;">
            <div class="card-header text-center bg-white border-0 pt-4 pb-2">
                <div class="d-inline-flex align-items-center justify-content-center bg-dark text-warning rounded-circle mb-2 shadow-sm" style="width: 56px; height: 56px;">
                    <i class="bi bi-shield-lock-fill fs-3"></i>
                </div>
                <div class="mb-1">
                    <span class="badge bg-warning text-dark font-monospace" style="font-size: 0.7rem;">
                        <i class="bi bi-lock-fill me-1"></i>{{ t('login_admin_badge') }}
                    </span>
                </div>
                <h4 class="fw-bold mb-1 text-dark">{{ t('login_admin_title') }}</h4>
                <p class="text-muted small mb-0 font-monospace">
                    AstraOps AI Operational Control Center
                </p>

            </div>
            <div class="card-body p-4 pt-2">
                <form method="POST" action="{{ url_for('auth.login_admin') }}" id="adminLoginForm" novalidate>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">
                            <i class="bi bi-person-badge text-dark"></i> {{ t('phone') }}
                        </label>
                        <input type="tel" class="form-control form-control-lg fs-6" id="phone" name="phone"
                               placeholder="{{ t('phone') }}"
                               value="{{ phone if phone else '' }}" required autofocus>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-key-fill text-dark"></i> {{ t('passcode_label') }}
                        </label>
                        <input type="password" class="form-control form-control-lg fs-6" id="password" name="password"
                               placeholder="{{ t('passcode_label') }}" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-dark btn-lg fw-semibold" id="adminLoginBtn">
                            <i class="bi bi-shield-shaded me-1"></i> Sign In as Admin
                        </button>
                    </div>
                </form>

                <!-- Back to Login Selection -->
                <div class="text-center mt-4 pt-2 border-top">
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> {{ t('back_to_login_select') }}
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    /**
     * Client-side form validation for admin login.
     */
    document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;

        if (!phone || !password) {
            e.preventDefault();
            if (typeof showToast === 'function') {
                showToast('Please enter both administrator phone number and password.', 'warning');
            }
            return;
        }
    });
</script>
{% endblock %}
