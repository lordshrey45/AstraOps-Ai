{% extends "base.html" %}

{% block title %}{{ t('login_pilgrim_title') }}{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-6 col-lg-5">

        <!-- Pilgrim Login Card -->
        <div class="card card-wari mt-3 shadow-sm border-0 rounded-4">
            <div class="card-header text-center bg-white border-0 pt-4 pb-2">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle mb-2" style="width: 56px; height: 56px;">
                    <i class="bi bi-person-circle fs-3"></i>
                </div>
                <h4 class="fw-bold mb-1 text-dark">{{ t('login_pilgrim_title') }}</h4>
                <p class="text-muted small mb-0">
                    {{ t('login_subtitle') }}
                </p>
            </div>
            <div class="card-body p-4 pt-2">
                <form method="POST" action="{{ url_for('auth.login_pilgrim') }}" id="loginForm" novalidate>

                    <!-- Phone Number -->
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">
                            <i class="bi bi-telephone text-primary"></i> {{ t('phone') }}
                        </label>
                        <input type="tel" class="form-control form-control-lg fs-6" id="phone" name="phone"
                               placeholder="{{ t('phone') }}"
                               value="{{ phone if phone else '' }}" required autofocus>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock text-primary"></i> {{ t('passcode_label') }}
                        </label>
                        <input type="password" class="form-control form-control-lg fs-6" id="password" name="password"
                               placeholder="{{ t('passcode_label') }}" required>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-wari btn-lg fw-semibold" id="loginBtn">
                            <i class="bi bi-box-arrow-in-right me-1"></i> {{ t('login_title') }}
                        </button>
                    </div>
                </form>

                <!-- Link to Register & Back to Selection -->
                <div class="text-center mt-4 pt-2 border-top">
                    <p class="mb-2">{{ t('dont_have_account') }}</p>
                    <a href="{{ url_for('auth.login') }}" class="text-decoration-none small text-muted">
                        <i class="bi bi-arrow-left me-1"></i> {{ t('back_to_login_select') }}
                    </a>
                </div>
            </div>
        </div>

    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    /**
     * Client-side form validation for pilgrim login.
     */
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value;

        if (!phone || !password) {
            e.preventDefault();
            if (typeof showToast === 'function') {
                showToast('Please enter both phone number and password.', 'warning');
            }
            return;
        }
    });
</script>
{% endblock %}
